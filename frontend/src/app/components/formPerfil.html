<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/src/assets/css/style.css">

    <title>NEUP Perfil</title>

    <style>
        
    </style>

</head>

<body>

    <div class="neup_container">

        <!-- pestañas -->

        <ul class="nav nav-tabs">

            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#sec1">
                    Sección 1
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sec2">
                    Sección 2
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sec3">
                    Sección 3
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sec4">
                    Sección 4
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sec5">
                    Sección 5
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sec6">
                    Sección 6
                </button>
            </li>

        </ul>

        <!-- contenido -->

        <div class="tab-content seccion">

            <!-- SECCION 1 -->

            <div class="tab-pane fade show active" id="sec1">

                <h4>Información básica</h4>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Nombre completo</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Edad</label>
                        <input type="number" class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Género</label>
                        <select class="form-select">
                            <option>Masculino</option>
                            <option>Femenino</option>
                            <option>Otro</option>
                            <option>Prefiero no decirlo</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <label>País / Ciudad</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Correo electrónico</label>
                    <input type="email" class="form-control">
                </div>

            </div>

            <!-- SECCION 2 -->

            <div class="tab-pane fade" id="sec2">

                <h4>Datos físicos</h4>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Estatura (cm)</label>
                        <input type="number" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Peso actual (kg)</label>
                        <input type="number" class="form-control">
                    </div>

                </div>

                <label>Objetivo</label>

                <select class="form-select">
                    <option>Bajar de peso</option>
                    <option>Mantener peso</option>
                    <option>Subir masa muscular</option>
                    <option>Comer saludable</option>
                </select>

            </div>

            <!-- SECCION 3 -->

            <div class="tab-pane fade" id="sec3">

                <h4>Actividad física</h4>

                <label>Frecuencia</label>

                <select class="form-select mb-3">
                    <option>No</option>
                    <option>1–2 veces</option>
                    <option>3–4 veces</option>
                    <option>5 o más</option>
                </select>

                <label>Tipo</label>

                <select class="form-select">
                    <option>Gimnasio</option>
                    <option>Deporte</option>
                    <option>Caminar / correr</option>
                </select>

            </div>

            <!-- SECCION 4 -->

            <div class="tab-pane fade" id="sec4">

                <h4>Preferencias alimenticias</h4>

                <label>Dieta</label>

                <select class="form-select mb-3">
                    <option>Ninguna</option>
                    <option>Vegetariana</option>
                    <option>Vegana</option>
                    <option>Keto</option>
                </select>

                <label>Alergias</label>

                <select class="form-select">
                    <option>Ninguna</option>
                    <option>Gluten</option>
                    <option>Lactosa</option>
                    <option>Frutos secos</option>
                    <option>Mariscos</option>
                </select>

            </div>

            <!-- SECCION 5 -->

            <div class="tab-pane fade" id="sec5">

                <h4>Hábitos alimenticios</h4>

                <label>Comidas al día</label>

                <select class="form-select mb-3">
                    <option>1–2</option>
                    <option>3</option>
                    <option>4–5</option>
                </select>

                <label>Comida rápida</label>

                <select class="form-select">
                    <option>Nunca</option>
                    <option>1 vez por semana</option>
                    <option>2–3 veces</option>
                    <option>Más de 3</option>
                </select>

            </div>

            <!-- SECCION 6 -->

            <div class="tab-pane fade" id="sec6">

                <h4>Personalización</h4>

                <label>¿Qué esperas de NEUP?</label>

                <select class="form-select mb-3">
                    <option>Recetas saludables</option>
                    <option>Planes de comida</option>
                    <option>Contador de calorías</option>
                    <option>Recomendaciones</option>
                </select>

                <button class="btn_neup">
                    Guardar Perfil
                </button>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
