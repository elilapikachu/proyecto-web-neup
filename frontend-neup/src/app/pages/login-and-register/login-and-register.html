<div class="container_registro">
    <div class="lado_imagen"></div>

    <div class="from__box">
        <div class="button__box">
            <!-- Píldora deslizante: se mueve según el modo activo -->
            <div class="slider-pill" [class.slider-pill--registro]="isRegister()"></div>

            <button type="button" class="toggle-btn" [class.toggle-btn--active]="isLogin()" (click)="setMode('login')">
                Iniciar Sesión
            </button>

            <button type="button" class="toggle-btn" [class.toggle-btn--active]="isRegister()"
                (click)="setMode('register')">
                Registro
            </button>
        </div>

        <!-- Formulario Inicio de Sesión -->
        <form class="grupos" [class.grupos--visible]="isLogin()" [class.grupos--oculto]="isRegister()"
            (ngSubmit)="onLoginSubmit()">
            <input type="email" class="inputs" placeholder="Email" required />
            <input type="password" class="inputs" placeholder="Contraseña" required />
            <div class="checkbox-row">
                <input type="checkbox" class="checkbox" id="recordatorio" />
                <label class="spanRegistro" for="recordatorio">Recordar Contraseña</label>
            </div>
            <button type="submit" class="submit-btn">Acceder</button>
        </form>

        <!-- Formulario Registro -->
        <form class="grupos" [class.grupos--visible]="isRegister()" [class.grupos--oculto]="isLogin()"
            (ngSubmit)="onRegisterSubmit()">
            <input type="text" class="inputs" placeholder="Nombre y Apellidos" required />
            <select class="inputs" required>
                <option value="" disabled selected>Género</option>
                <option value="0">Masculino</option>
                <option value="1">Femenino</option>
                <option value="2">Otro</option>
                <option value="3">Prefiero no decirlo</option>
            </select>
            <input type="email" class="inputs" placeholder="Email" required />
            <input type="password" class="inputs" placeholder="Contraseña" required />
            <div class="checkbox-row">
                <input type="checkbox" class="checkbox" id="terminos" required />
                <label class="spanRegistro" for="terminos">Acepto los términos y condiciones</label>
            </div>
            <button type="submit" class="submit-btn">Registrarse</button>
        </form>
    </div>

    <div class="volverPaginaPrincipal">
        <button class="submit-btn btn_regresar_pagina_principal">
            <a routerLink="/">Volver a la página principal</a>
        </button>
    </div>
</div>
